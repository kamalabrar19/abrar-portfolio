<!doctype html><html lang="id"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><style>body{margin:0;font:14px system-ui;background:#f5f7f2;color:#172019}main{max-width:1100px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}nav button{background:#e6eee0;color:#40513f}nav button.active,.save{background:#a9dd52;color:#21301d}.panel{background:#fff;border:1px solid #dfe7dd;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{border:1px solid #dfe7dd;border-radius:12px;padding:16px}label{display:block;color:#718076;font-size:12px;font-weight:700;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;border:1px solid #dfe7dd;border-radius:8px;padding:9px;font:inherit}textarea{min-height:80px}.status{color:#718076;margin-top:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}}</style><main><header><div><h1>Portfolio Admin</h1><div class="status">Edit portfolio langsung dari /admin</div></div><button onclick="location.reload()">Refresh</button></header><nav id="nav"></nav><section class="panel"><h2 id="title">Overview</h2><div id="content"></div><button class="save" id="save" style="display:none">Simpan perubahan</button><div id="status" class="status"></div></section></main><script>
let data={},tab='overview',keys=['projects','experience','skills','moments'];const title={projects:'Projects',experience:'Experience',skills:'Skills',moments:'Moments'};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){data=await(await fetch('/api/content')).json();drawNav();draw()}function drawNav(){nav.innerHTML='<button class="active" data-k="overview">Overview</button>'+keys.map(k=>`<button data-k="${k}">${title[k]}</button>`).join('');nav.onclick=e=>{let b=e.target.closest('button');if(!b)return;collect();tab=b.dataset.k;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));draw()}}function draw(){titleEl.textContent=tab==='overview'?'Overview':title[tab];save.style.display=tab==='overview'?'none':'inline-block';if(tab==='overview'){content.innerHTML='<p class="status">'+keys.map(k=>`${title[k]}: <b>${data[k].length}</b>`).join(' · ')+'</p>';return}content.innerHTML='<div class="grid">'+data[tab].map((o,i)=>`<article class="item"><b>${esc(o.name||o.role||o.title||o.company||'Item '+(i+1))}</b>${Object.entries(o).filter(([k])=>k!=='id'&&k!=='number').map(([k,v])=>`<label>${k}<${Array.isArray(v)||String(v).length>90?'textarea':'input'} id="f-${i}-${k}" ${Array.isArray(v)?'data-array':''}>${esc(Array.isArray(v)?v.join(', '):v)}</${Array.isArray(v)||String(v).length>90?'textarea':'input'}></label>`).join('')}</article>`).join('')+'</div>'}function collect(){if(tab==='overview')return;data[tab].forEach((o,i)=>Object.keys(o).forEach(k=>{if(k==='id'||k==='number')return;let e=document.getElementById(`f-${i}-${k}`);if(e)o[k]=e.dataset.array!==undefined?e.value.split(',').map(x=>x.trim()).filter(Boolean):e.value}))}save.onclick=async()=>{collect();status.textContent='Menyimpan…';let r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});status.textContent=r.ok?'Perubahan berhasil disimpan.':'Gagal menyimpan.'};const titleEl=document.getElementById('title');load();
</script></html>
